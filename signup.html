<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f0e9">
  <title>Reģistrācija — To-Do</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="script.css">
</head>
<body>
  <main class="login-shell">
    <section class="form-panel">
      <div class="form-wrap">
        <div class="mobile-brand">
          <span>To-Do</span>
        </div>

        <div class="form-heading">
          <h2>Izveido kontu</h2>
          <p>Reģistrējies, lai ērti plānotu savus ikdienas darbus.</p>
        </div>

        <form id="signup-form" novalidate>
          <div class="field">
            <label for="name">Vārds un uzvārds</label>
            <div class="input-wrap">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
              <input id="name" name="name" type="text" placeholder="Tavs vārds" autocomplete="name" required>
            </div>
            <span class="error-message" id="name-error"></span>
          </div>

          <div class="field">
            <label for="email">E-pasta adrese</label>
            <div class="input-wrap">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/></svg>
              <input id="email" name="email" type="email" placeholder="tu@example.com" autocomplete="email" required>
            </div>
            <span class="error-message" id="email-error"></span>
          </div>

          <div class="field">
            <label for="password">Parole</label>
            <div class="input-wrap">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              <input id="password" name="password" type="password" placeholder="Vismaz 6 rakstzīmes" autocomplete="new-password" minlength="6" required>
              <button class="password-toggle" type="button" aria-label="Rādīt paroli" aria-pressed="false">
                <svg class="eye-open" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
                <svg class="eye-closed" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 3 18 18"/><path d="M10.6 6.2A10.7 10.7 0 0 1 12 6c6.5 0 10 6 10 6a17 17 0 0 1-2.4 3.1M6.2 6.2C3.4 8 0 12 0 12s3.5 6 10 6a9.8 9.8 0 0 0 3.4-.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
              </button>
            </div>
            <span class="error-message" id="password-error"></span>
          </div>

          <div class="field">
            <label for="confirm">Atkārto paroli</label>
            <div class="input-wrap">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              <input id="confirm" name="confirm" type="password" placeholder="Ievadi paroli vēlreiz" autocomplete="new-password" minlength="6" required>
            </div>
            <span class="error-message" id="confirm-error"></span>
          </div>

          <label class="remember">
            <input type="checkbox" name="terms" required>
            <span class="custom-check" aria-hidden="true"></span>
            Piekrītu lietošanas noteikumiem un privātuma politikai
          </label>

          <button class="btn" type="submit">
            <span>Izveidot kontu</span>
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
          <p class="status" id="status" role="status"></p>
        </form>

        <p class="signup">Tev jau ir konts? <a href="index.html">Pieraksties</a></p>
        <p class="legal">Uzzini, kā tiek apstrādāti tavi dati, privātuma politikā.</p>
      </div>
    </section>
  </main>

  <script src="script.js?v=4"></script>
</body>
</html>
